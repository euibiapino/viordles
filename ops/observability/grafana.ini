[server]
http_addr = 127.0.0.1
http_port = 3300
[paths]
data = /home/ubuntu/viordles-observability/data/grafana
logs = /home/ubuntu/viordles-observability/data/grafana-logs
plugins = /home/ubuntu/viordles-observability/data/plugins
provisioning = /home/ubuntu/viordles-observability/config/provisioning
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[users]
allow_sign_up = false
[auth.anonymous]
enabled = true
org_role = Viewer
[plugins]
preinstall_disabled = true
[log]
level = warn
[security]
admin_user = admin
