auth_enabled: false
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /home/ubuntu/viordles-observability/data/loki
  storage:
    filesystem:
      chunks_directory: /home/ubuntu/viordles-observability/data/loki/chunks
      rules_directory: /home/ubuntu/viordles-observability/data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
compactor:
  working_directory: /home/ubuntu/viordles-observability/data/loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
limits_config:
  retention_period: 168h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  max_query_parallelism: 2
  split_queries_by_interval: 24h
analytics:
  reporting_enabled: false
