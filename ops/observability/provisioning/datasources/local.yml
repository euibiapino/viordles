apiVersion: 1
datasources:
  - name: Viordles metrics
    uid: viordles-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
  - name: Viordles logs
    uid: viordles-loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    editable: false
